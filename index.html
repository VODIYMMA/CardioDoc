&lt;textarea id=&quot;status&quot; placeholder=&quot;Умумий аҳволи, АБ, ЮҚС, SpO₂ ва аускультация маълумотлари...&quot;&gt;Объектив: Умумий аҳволи ўрта оғирликда, ҳуши жойида, ҳолати фаол. Тери қопламлари ва кўринадиган шиллиқ қаватлари оч пушти рангда. Периферик шишлар оёқларда ва қорин соҳасида мавжуд. Периферик лимфа тугунлари катталашмаган. Суяк-мушак тизимида деформациялар аниқланмайди.
Нафас олиши бурун орқали, нафас ҳаракатлари сони 18 та/мин. Кўкрак қафаси цилиндрик шаклда, нафас актида симметрик иштирок этади. Перкуссияда аниқ ўпка товуши. Пальпацияда овоз дириллаши икки томонда бир хил. Аускультацияда ўпкада везикуляр нафас сусайган, икки ўпканинг пастки 1/3 қисмида нафас сусайган.
Юрак соҳасида деформация йўқ. Юрак чўққи турткиси кўзга кўринмайди, пальпацияда чап ўрта ўмров чизиғи (l. mediaclavicularis sinistra) бўйлаб V қовурғалараро оралиқда аниқланади. Юрак чегаралари: чапдан — V қовурғалараро оралиқда, чап ўрта ўмров чизиғи бўйлаб; ўнгдан — тўш суягининг ўнг қиррасидан 0,5 см ташқарида; юқоридан — III қовурға сатҳида. Юрак тонлари бўғиқ, аритмик. Қабул вақтида АБ — 110/80 мм сим. уст., ҳозирда — 100/70 мм сим. уст. Пульс — 70–80 та/мин, аритмик. ЮҚС — 95 та/мин.
Тили тоза, нам. Қорни юмшоқ, оғриқсиз. Жигар Курлов бўйича 9/10/11 см. Талоқ пайпасланмайди. Пастернацкий белгиси икки томонда манфий. Ич келиши мунтазам. Сийиши эркин, оғриқсиз, миқдори камайган. Суткалик диурез — 1,0 л.&lt;/textarea&gt;

Med(9)&quot; type=&quot;button&quot;&gt;Сиглип 50мг&lt;/button&gt;&lt;button class=&quot;btn small&quot; onclick=&quot;addDischargeMed(10)&quot; type=&quot;button&quot;&gt;Небивалол STADA 5мг&lt;/button&gt;&lt;button class=&quot;btn small&quot; onclick=&quot;addDischargeMed(11)&quot; type=&quot;button&quot;&gt;Ромазик 20мг&lt;/button&gt;&lt;button class=&quot;btn small&quot; onclick=&quot;addDischargeMed(12)&quot; type=&quot;button&quot;&gt;Зетор плюс 20/10мг&lt;/button&gt;&lt;button class=&quot;btn small&quot; onclick=&quot;addDischargeMed(13)&quot; type=&quot;button&quot;&gt;Валодип 10/160мг&lt;/button&gt;&lt;button class=&quot;btn small&quot; onclick=&quot;addDischargeMed(14)&quot; type=&quot;button&quot;&gt;Валодип 5/80мг&lt;/button&gt;&lt;button class=&quot;btn small&quot; onclick=&quot;addDischargeMed(15)&quot; type=&quot;button&quot;&gt;Амрадипин 4/5мг&lt;/button&gt;&lt;button class=&quot;btn small&quot; onclick=&quot;addDischargeMed(16)&quot; type=&quot;button&quot;&gt;Тримеик 8/2,5/10мг&lt;/button&gt;&lt;button class=&quot;btn small&quot; onclick=&quot;addDischargeMed(17)&quot; type=&quot;button&quot;&gt;Бемкор 180мг&lt;/button&gt;&lt;button class=&quot;btn small&quot; onclick=&quot;addDischargeMed(18)&quot; type=&quot;button&quot;&gt;Бемзет 180/10мг&lt;/button&gt;&lt;button class=&quot;btn small&quot; onclick=&quot;addDischargeMed(19)&quot; type=&quot;button&quot;&gt;Амра би форте 8/2,5мг&lt;/button&gt;&lt;/div&gt;&lt;textarea id=&quot;meds&quot; placeholder=&quot;Таблеткалар:

&lt;section class=&quot;section&quot; id=&quot;s-report&quot;&gt;&lt;div class=&quot;pagehead&quot;&gt;&lt;div&gt;&lt;h2&gt;Кўчирма эпикриз&lt;/h2&gt;&lt;div class=&quot;sub&quot;&gt;Дастлабки ҳужжат — имзолашдан олдин барча майдонларни текширинг&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;actions no-print&quot;&gt;&lt;button class=&quot;btn secondary&quot; onclick=&quot;go('patient')&quot; type=&quot;button&quot;&gt;← Таҳрирлашга қайтиш&lt;/button&gt;&lt;select id=&quot;reportLang&quot; onchange=&quot;buildReport()&quot; style=&quot;width:auto&quot;&gt;&lt;option value=&quot;ru&quot;&gt;Русча&lt;/option&gt;&lt;option selected=&quot;&quot; value=&quot;uz&quot;&gt;Ўзбекча (кириллица)&lt;/option&gt;&lt;option value=&quot;both&quot;&gt;Русча + ўзбекча&lt;/option&gt;&lt;/select&gt;&lt;button class=&quot;btn&quot; onclick=&quot;buildReport()&quot;&gt;Янгилаш&lt;/button&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;exportWord()&quot;&gt;↓ Word&lt;/button&gt;&lt;button class=&quot;btn green&quot; onclick=&quot;window.print()&quot;&gt;↓ PDF / Чоп этиш&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row no-print&quot; style=&quot;margin-bottom:12px&quot;&gt;&lt;span class=&quot;hint&quot;&gt;Word: Microsoft Word ва iPhone «Файллар» иловасига мос .docx ҳужжат юклаб олинади. PDF: чоп этиш ойнасида «PDF сифатида сақлаш»ни танланг.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;report&quot; id=&quot;reportText&quot;&gt;Бемор маълумотларини киритинг ва «Янгилаш» тугмасини босинг.&lt;/div&gt;&lt;div class=&quot;footer&quot;&gt;Dr. Dostonbek Toshnazarov · Ҳужжат киритилган маълумотлар асосида шакллантирилади ва даволовчи шифокор томонидан текширилиши лозим.&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot; id=&quot;s-history&quot;&gt;&lt;div class=&quot;pagehead&quot;&gt;&lt;div&gt;&lt;h2&gt;Беморлар тарихи&lt;/h2&gt;&lt;div class=&quot;sub&quot;&gt;Ушбу қурилма ва браузерда сақланган бемор карталари&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;newPatient()&quot;&gt;＋ Янги бемор&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;Ф.И.Ш. ёки касаллик тарихи рақами бўйича қидириш&lt;/label&gt;&lt;input id=&quot;searchHistory&quot; oninput=&quot;renderHistory()&quot; placeholder=&quot;Киритишни бошланг...&quot;/&gt;&lt;/div&gt;&lt;div class=&quot;patientlist&quot; id=&quot;patientList&quot;&gt;&lt;/div&gt;&lt;div class=&quot;divider&quot;&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;btn&quot; onclick=&quot;backup()&quot;&gt;Захира нусхасини экспорт қилиш&lt;/button&gt;&lt;label class=&quot;btn&quot; for=&quot;restoreFile&quot; style=&quot;cursor:pointer&quot;&gt;Захира нусхасини импорт қилиш&lt;/label&gt;&lt;input accept=&quot;application/json&quot; class=&quot;hidden&quot; id=&quot;restoreFile&quot; onchange=&quot;restore(event)&quot; type=&quot;file&quot;/&gt;&lt;button class=&quot;btn danger&quot; onclick=&quot;deleteCurrent()&quot;&gt;Жорий бемор картасини ўчириш&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;hint&quot;&gt;Захира нусхасини шифрланган жойда сақланг. Шахсий тиббий маълумотлар сақланган файлни ҳимояланмаган каналлар орқали юборманг.&lt;/p&gt;&lt;/section&gt;

&lt;script&gt;
const ids=[...document.querySelectorAll('input[id],textarea[id],select[id]')].map(x=&gt;x.id).filter(x=&gt;!['reportLang','searchHistory','restoreFile'].includes(x));let currentId=null,saveTimer=null;
function val(id){return (document.getElementById(id)?.value||'').trim()}function set(id,v){let e=document.getElementById(id);if(e)e.value=v??''}

// CHA2DS2-VA (ESC 2024) and HAS-BLED, calculated only after clinician confirmation.
const riskWeights={va:{hf:1,htn:1,age75:2,dm:1,stroke:2,vascular:1,age65:1},has:{bp:1,renal:1,liver:1,stroke:1,bleed:1,inr:1,age:1,drugs:1,alcohol:1}};
function riskAge(){const a=parseInt(val('age'),10);return Number.isFinite(a)&amp;&amp;a&gt;=0&amp;&amp;a&lt;=120?a:null;}
function riskCheckboxes(){return [...document.querySelectorAll('#afRiskPanel input[type=&quot;checkbox&quot;]')];}
function riskChanged(){
 const obj={};riskCheckboxes().forEach(c=&gt;{if(c.checked)(obj[c.dataset.risk]??=[]).push(c.dataset.key)});
 set('afRiskSelections',JSON.stringify(obj));set('afRiskConfirmed','');set('finalCha2ds2vasc','');set('finalHasbled','');
 const preview=document.getElementById('riskPreview');if(preview)preview.textContent='Ўзгаришлар бор — қайта тасдиқланг';scheduleSave();
}
function syncRiskUI(){
 let data={};try{data=JSON.parse(val('afRiskSelections')||'{}')}catch(e){}
 riskCheckboxes().forEach(c=&gt;c.checked=Array.isArray(data[c.dataset.risk])&amp;&amp;data[c.dataset.risk].includes(c.dataset.key));
 const age=riskAge();
 for(const c of riskCheckboxes()){
  if(c.dataset.risk==='va'&amp;&amp;['age65','age75'].includes(c.dataset.key)){
   c.checked=age!==null&amp;&amp;(c.dataset.key==='age65'?age&gt;=65&amp;&amp;age&lt;=74:age&gt;=75);
   c.disabled=age!==null;
  }
  if(c.dataset.risk==='has'&amp;&amp;c.dataset.key==='age'){
   c.checked=age!==null&amp;&amp;age&gt;65;c.disabled=age!==null;
  }
 }
 const preview=document.getElementById('riskPreview');if(preview)preview.textContent=val('afRiskConfirmed')==='yes'?'Баллар тасдиқланган':'Ҳали тасдиқланмаган';
}
function applyRiskScores(){
 const age=riskAge();if(age===null){alert('Аввал паспорт қисмида бемор ёшини киритинг.');return;}
 if(!/Бўлмачалар фибрилляцияси/i.test(val('finalComplications'))){alert('Аввал якуний ташхиснинг «Асорат» қисмига БФ шаблонини қўшинг.');return;}
 syncRiskUI();const selected={};let va=0,has=0;
 riskCheckboxes().forEach(c=&gt;{if(c.checked){(selected[c.dataset.risk]??=[]).push(c.dataset.key);const w=riskWeights[c.dataset.risk]?.[c.dataset.key]||0;if(c.dataset.risk==='va')va+=w;else has+=w;}});
 set('afRiskSelections',JSON.stringify(selected));set('finalCha2ds2vasc',String(va));set('finalHasbled',String(has));set('afRiskConfirmed','yes');
 const preview=document.getElementById('riskPreview');if(preview)preview.textContent=`CHA₂DS₂-VA — ${va}; HAS-BLED — ${has} балл. Якуний ташхисга қўшилди.`;
 scheduleSave();
}
function resetRiskScores(){set('afRiskSelections','');set('afRiskConfirmed','');set('finalCha2ds2vasc','');set('finalHasbled','');syncRiskUI();scheduleSave();}

function setPreMainTemplate(type){
 const year=val('preMainYear');
 const yearPart=/^\d{4}$/.test(year)?`(${year} й.)`:'';
 const base='ЮИК. Зўриқиш стенокардияси, ФС III.';
 const templates={
  ibs:base,
  pix:base+' ИККС (ЭКГ ва ЭхоКГ бўйича).',
  kag:base+` Тож томирлар КАГси ва стентлаш амалиётидан кейинги ҳолат${yearPart?' '+yearPart:''}.`,
  aks:base+` АКШ амалиётидан кейинги ҳолат${yearPart?' '+yearPart:''}.`,
  gb:'Гипертония касаллиги, III босқич, АГ 1-даража, хавф 4 (жуда юқори).',
  icm:'Ишемик кардиомиопатия.',
  dcm:'Дилатацион кардиомиопатия.'
 };
 const field=document.getElementById('preMain');if(!field)return;
 let addition=templates[type]||'';
 let current=field.value.trim();
 // ЮИК ва зўриқиш стенокардияси умумий қисмини иккинчи марта қўшмаймиз.
 if(type==='pix'||type==='kag'||type==='aks') addition=addition.replace(base,'').trim();
 if(addition &amp;&amp; current.includes(addition)) return;
 if(type==='ibs' &amp;&amp; current.includes(base)) return;
 field.value=current?(addition?current+' '+addition:current):addition;
 field.dispatchEvent(new Event('input',{bubbles:true}));scheduleSave();
}
function updatePreMainOperationYear(){
 const year=val('preMainYear');
 const field=document.getElementById('preMain');if(!field)return;
 // Не фиксируем промежуточные цифры при наборе года на мобильной клавиатуре.
 // Год добавляется только после ввода всех четырёх цифр.
 const validYear=/^\d{4}$/.test(year);
 field.value=field.value.replace(/(Тож томирлар КАГси ва стентлаш амалиётидан кейинги ҳолат|АКШ амалиётидан кейинги ҳолат)(?: \(\d{1,4} й\.\))?/g,
   (match, phrase)=&gt;phrase+(validYear?` (${year} й.)`:''));
 scheduleSave();
}

function addPerOs(index){
 const item=perOsTemplates[index]; const field=document.getElementById('therapy'); if(!item||!field)return;
 let lines=field.value.split('\n').map(x=&gt;x.trim()).filter(Boolean);
 const posExisting=lines.findIndex(line=&gt;/^per os:/i.test(line));
 const existing=posExisting&gt;=0?lines[posExisting].replace(/^per os:\s*/i,'').split(/,\s*/).map(x=&gt;x.replace(/[.;]\s*$/,'').trim()):[];
 if(existing.includes(item))return;
 if(!lines.length) lines=['Олган муолажалари:','per os: '+item+'.'];
 else {
  if(!lines.some(line=&gt;/^Олган муолажалари:/i.test(line))) lines.unshift('Олган муолажалари:');
  const pos=lines.findIndex(line=&gt;/^per os:/i.test(line));
  if(pos&gt;=0) lines[pos]=lines[pos].replace(/[.;]\s*$/,'')+', '+item+'.';
  else lines.push('per os: '+item+'.');
 }
 field.value=lines.join('\n'); field.dispatchEvent(new Event('input',{bubbles:true})); scheduleSave();
}

 'Аргинал 100.0',
 'Ревартон 1.0',
 'ККБ 100мг',

function addParenteral(index){
 const item=parenteralTemplates[index]; const field=document.getElementById('therapy'); if(!item||!field)return;
 let lines=field.value.split('\n').map(x=&gt;x.trim()).filter(Boolean);
 const pos=lines.findIndex(line=&gt;/^Парентерал:/i.test(line));
 const existing=pos&gt;=0?lines[pos].replace(/^Парентерал:\s*/i,'').split(/,\s*/).map(x=&gt;x.replace(/[.;]\s*$/,'').trim()):[];
 const normalized=item.replace(/[.;]\s*$/,'').trim();
 if(existing.includes(normalized))return;
 if(!lines.some(line=&gt;/^Олган муолажалари:/i.test(line)))lines.unshift('Олган муолажалари:');
 const newItem=item.replace(/[.;]\s*$/,'');

function formatUzPhone(raw){
 let digits=String(raw||'').replace(/\D/g,'');
 if(digits.startsWith('00998'))digits=digits.slice(5);
 else if(digits.startsWith('998'))digits=digits.slice(3);
 else if(digits.startsWith('0'))digits=digits.slice(1);
 digits=digits.slice(0,9);
 if(!digits)return '';
 const parts=[];
 if(digits.length&gt;0)parts.push(digits.slice(0,2));
 if(digits.length&gt;2)parts.push(digits.slice(2,5));
 if(digits.length&gt;5)parts.push(digits.slice(5,7));
 if(digits.length&gt;7)parts.push(digits.slice(7,9));
 return '+998 '+parts.join(' ');
}

  hf:&quot;Бемор ўзини охирги 1 ҳафтадан бери хаста деб ҳисоблайди. Сурункали юрак етишмовчилигига хос шикоятлар тахминан 1 ой олдин пайдо бўлган. Охирги кунларда юқоридаги шикоятларнинг кучайиб бориши кузатилган. Бемор кўп йиллардан бери стационар ва амбулатор шароитда даволаниб келади. Доимий равишда дори воситаларини қабул қилиб келган. Анамнезида миокард инфаркти — (сана). Сурункали касалликлардан артериал гипертензия мавжуд, бемор артериал қон босимини назорат қилиб келган. Сўнгги вақтларда шифокор тавсияларига тўлиқ амал қилмагани ва айрим дори воситаларини қабул қилишни тўхтатгани сабабли касаллик белгилари кучайган ва қайта госпитализация зарурати юзага келган. Бемор текширувлардан ўтказиш ва даволаш мақсадида клиникамизга ётқизилган.&quot;,
  dm:&quot;Бемор 2-тур қандли диабет билан касалланади. Шифокор томонидан тавсия этилган парҳезга тўлиқ амал қилмайди. Қондаги глюкоза миқдорини мунтазам назорат қилиб келмайди.&quot;,
  kag:&quot;Бемор 20__ йилда коронарография текширувидан ўтган ва коронар артерияларга стент имплантацияси амалиёти бажарилган.&quot;
 };

function createDocxXml(){let d=$('date').value;let date=d?d.split('-').reverse().join('.')+' й.':'';let ps=[];ps.push(`&lt;w:p&gt;&lt;w:pPr&gt;&lt;w:tabs&gt;&lt;w:tab w:val=&quot;right&quot; w:pos=&quot;10200&quot;/&gt;&lt;/w:tabs&gt;&lt;w:spacing w:after=&quot;280&quot;/&gt;&lt;/w:pPr&gt;${wordRun('Бемор: ',true,30)}${wordRun(($('patient').value||'________________')+' '+($('year').value||'________')+' й.',false,30)}&lt;w:r&gt;&lt;w:tab/&gt;&lt;/w:r&gt;${wordRun(date,false,28)}&lt;/w:p&gt;`);state.items.forEach((x,i)=&gt;{const m=meds[x.id];let freq=x.frequency==='Ҳар куни'?'':', '+x.frequency.toLowerCase();let t=normalTime(x,m);let timing=t.startsWith('эрталаб')||t.startsWith('2 маҳал')||t.startsWith('ҳафтада')?t:t+' да';let note=m.note?', '+m.note:'';let medSize=state.items.length&gt;5?56:72;let title=wordRun((i+1)+'. ',false,medSize)+wordRun((x.id===manualMedId?(x.manualName||'Янги дори')+' '+(x.manualStrength||''):m.name+' '+m.strength),true,medSize);ps.push(wordParagraph(title,{after:state.items.length&gt;5?20:80}));let schedule=wordRun(x.amount+' таб. '+timing+freq+note+'.',false,medSize,true);ps.push(wordParagraph(schedule,{center:true,after:state.items.length&gt;5?90:(x.bp&amp;&amp;bpGroups.includes(m.group)?100:340)}));if(x.bp&amp;&amp;bpGroups.includes(m.group))ps.push(wordParagraph(wordRun('Доимо! Уйда артериал қон босим назоратида!',false,36,true),{after:340}));});return `&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot; standalone=&quot;yes&quot;?&gt;&lt;w:document xmlns:w=&quot;http://schemas.openxmlformats.org/wordprocessingml/2006/main&quot;&gt;&lt;w:body&gt;${ps.join('')}&lt;w:sectPr&gt;&lt;w:pgSz w:w=&quot;${getPaperSize()==='A5'?8391:11906}&quot; w:h=&quot;${getPaperSize()==='A5'?11906:16838}&quot;/&gt;&lt;w:pgMar w:top=&quot;567&quot; w:right=&quot;${getPaperSize()==='A5'?510:850}&quot; w:bottom=&quot;567&quot; w:left=&quot;${getPaperSize()==='A5'?510:850}&quot; w:header=&quot;0&quot; w:footer=&quot;0&quot; w:gutter=&quot;0&quot;/&gt;&lt;/w:sectPr&gt;&lt;/w:body&gt;&lt;/w:document&gt;`;}
function crc32(bytes){let c=-1;for(let b of bytes){c^=b;for(let k=0;k&lt;8;k++)c=(c&gt;&gt;&gt;1)^((c&amp;1)?0xedb88320:0);}return(c^-1)&gt;&gt;&gt;0;}
function zipStore(files){const enc=new TextEncoder();let parts=[],central=[],offset=0;const u16=(v)=&gt;[v&amp;255,(v&gt;&gt;&gt;8)&amp;255],u32=(v)=&gt;[v&amp;255,(v&gt;&gt;&gt;8)&amp;255,(v&gt;&gt;&gt;16)&amp;255,(v&gt;&gt;&gt;24)&amp;255];for(let [name,data] of files){let n=enc.encode(name),b=enc.encode(data),crc=crc32(b);let local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(b.length),...u32(b.length),...u16(n.length),...u16(0),...n]);parts.push(local,b);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(b.length),...u32(b.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...n]));offset+=local.length+b.length;}let centralSize=central.reduce((a,b)=&gt;a+b.length,0);let end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centralSize),...u32(offset),...u16(0)]);return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});}
function downloadWord(){const types='&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;&lt;Types xmlns=&quot;http://schemas.openxmlformats.org/package/2006/content-types&quot;&gt;&lt;Default Extension=&quot;rels&quot; ContentType=&quot;application/vnd.openxmlformats-package.relationships+xml&quot;/&gt;&lt;Default Extension=&quot;xml&quot; ContentType=&quot;application/xml&quot;/&gt;&lt;Override PartName=&quot;/word/document.xml&quot; ContentType=&quot;application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml&quot;/&gt;&lt;/Types&gt;';const rels='&lt;?xml version=&quot;1.0&quot; encoding=&quot;UTF-8&quot;?&gt;&lt;Relationships xmlns=&quot;http://schemas.openxmlformats.org/package/2006/relationships&quot;&gt;&lt;Relationship Id=&quot;rId1&quot; Type=&quot;http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument&quot; Target=&quot;word/document.xml&quot;/&gt;&lt;/Relationships&gt;';let blob=zipStore([['[Content_Types].xml',types],['_rels/.rels',rels],['word/document.xml',createDocxXml()]]);let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='Tabletkalar-Blankasi-'+getPaperSize()+'-'+($('date').value||'blank')+'.docx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=&gt;URL.revokeObjectURL(url),15000);}

const DB_KEY='tabletkalarPatientsV1';
function getDb(){try{const v=JSON.parse(localStorage.getItem(DB_KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function putDb(db){try{localStorage.setItem(DB_KEY,JSON.stringify(db));return true}catch(e){alert('Браузер хотирасига сақлаб бўлмади. Браузерда сақлашга рухсат берилганини текширинг.');return false}}
function dbDate(){return new Date().toISOString()}
function dbRender(){const db=getDb(),q=$('dbSearch').value.trim().toLowerCase();$('dbCount').textContent='('+db.length+' та)';const list=db.filter(x=&gt;(x.patient+' '+x.year).toLowerCase().includes(q));$('dbList').innerHTML=list.length?list.map(x=&gt;`&lt;div class=&quot;db-row&quot;&gt;&lt;div class=&quot;db-info&quot;&gt;&lt;strong&gt;${esc(x.patient||'Номсиз бемор')} ${esc(x.year||'')} й.&lt;/strong&gt;&lt;div&gt;&lt;small&gt;${esc(x.date||'')} · ${x.items.length} та дори&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;button data-load=&quot;${esc(x.uid)}&quot;&gt;Очиш&lt;/button&gt;&lt;button class=&quot;db-delete&quot; data-remove=&quot;${esc(x.uid)}&quot;&gt;Ўчириш&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`).join(''):'&lt;p class=&quot;db-help&quot;&gt;Беморлар топилмади.&lt;/p&gt;';$('dbList').querySelectorAll('[data-load]').forEach(b=&gt;b.onclick=()=&gt;{const rec=getDb().find(x=&gt;x.uid===b.dataset.load);if(!rec)return;if((state.items.length||$('patient').value)&amp;&amp;!confirm('Ҳозирги бланк ўрнига сақланган бемор очилсинми?'))return;$('patient').value=rec.patient;$('year').value=rec.year;$('date').value=rec.date;state.items=rec.items.filter(x=&gt;meds[x.id]).map(x=&gt;({...x}));render();window.scrollTo({top:0,behavior:'smooth'});});$('dbList').querySelectorAll('[data-remove]').forEach(b=&gt;b.onclick=()=&gt;{const db=getDb(),rec=db.find(x=&gt;x.uid===b.dataset.remove);if(!rec||!confirm((rec.patient||'Бемор')+' маълумотлари базадан ўчирилсинми?'))return;putDb(db.filter(x=&gt;x.uid!==rec.uid));dbRender();});}
$('dbToggle').onclick=()=&gt;{$('dbBody').hidden=!$('dbBody').hidden;dbRender()};
$('dbSearch').addEventListener('input',dbRender);
$('dbSave').onclick=()=&gt;{const patient=$('patient').value.trim();if(!patient){alert('Аввал бемор Ф.И.О. ни киритинг.');$('patient').focus();return}if(!state.items.length){alert('Аввал камида битта дори танланг.');return}const db=getDb(),year=$('year').value,date=$('date').value;const old=db.find(x=&gt;x.patient.toLowerCase()===patient.toLowerCase()&amp;&amp;x.year===year&amp;&amp;x.date===date);if(old&amp;&amp;!confirm('Шу беморнинг шу санадаги бланкини янгилаймизми?'))return;const rec={uid:old?.uid||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)),patient,year,date,items:state.items.map(x=&gt;({...x})),updated:dbDate()};if(old)db.splice(db.indexOf(old),1,rec);else db.unshift(rec);if(putDb(db)){dbRender();alert('Бемор базада сақланди.')}};
dbRender();
